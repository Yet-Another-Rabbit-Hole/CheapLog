plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.1.0'
}

group = 'net.YaRh'
version = '2.0.0'

gh_user = System.getenv("GITHUB_ACTOR") ? System.getenv("GITHUB_ACTOR") : project.findProperty("gpr.user")
gh_pwd = System.getenv("GITHUB_TOKEN") ? System.getenv("GITHUB_TOKEN") : project.findProperty("gpr.key")

repositories {
    mavenCentral()

    maven {
        url = uri("https://maven.pkg.github.com/Yet-Another-Rabbit-Hole/ConvenientConfiguration")

        credentials {
            username = gh_user
            password = gh_pwd
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'net.YaRh:convconf:1.0.0'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifactId = 'cheaplog'
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/Yet-Another-Rabbit-Hole/CheapLog"

            credentials {
                username = gh_user
                password = gh_pwd
            }
        }
    }
}

tasks.register("updateLocal") {
    dependsOn testClasses
    dependsOn jar
    dependsOn shadowJar
    dependsOn javadoc
    dependsOn publishToMavenLocal
}